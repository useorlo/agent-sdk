# Publish a reviewed SDK version from main; the first release uses a repository secret.
name: Publish npm SDK
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
        default: '0.0.2'
      verify_only:
        description: Verify an existing release without publishing again
        required: true
        type: boolean
        default: false
      authentication:
        description: Use the bootstrap token only until npm trusted publishing is configured
        required: true
        type: choice
        options: [trusted, bootstrap-token]
        default: trusted
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Check the requested release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "const p=require('./packages/typescript/package.json'); if(p.name!=='@orlo/agent-sdk'||p.version!==process.env.RELEASE_VERSION||p.private) throw new Error('Requested version does not match the public SDK package');"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm pack --workspace=@orlo/agent-sdk --dry-run
      - name: Publish with provenance
        if: ${{ !inputs.verify_only }}
        env:
          NODE_AUTH_TOKEN: ${{ inputs.authentication == 'bootstrap-token' && secrets.NPM_TOKEN || '' }}
          RELEASE_AUTHENTICATION: ${{ inputs.authentication }}
        run: |
          if [ "$RELEASE_AUTHENTICATION" = "bootstrap-token" ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Add the NPM_TOKEN repository Actions secret before the first release.' >&2
            exit 1
          fi
          npm publish --workspace=@orlo/agent-sdk --access public --provenance
      - name: Verify installation from npm
        timeout-minutes: 20
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          # npm scans new publications before they become installable.
          available=false
          for attempt in $(seq 1 60); do
            if npm view "@orlo/agent-sdk@$RELEASE_VERSION" version --json --prefer-online --fetch-retries=0 --fetch-timeout=10000 | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => { try { process.exit(JSON.parse(input) === process.env.RELEASE_VERSION ? 0 : 1); } catch { process.exit(1); } });"; then
              available=true
              break
            fi
            echo "Waiting for the public registry ($attempt/60)..."
            sleep 15
          done
          if [ "$available" != true ]; then
            echo 'Registry verification timed out. Use verify_only to check this version again without republishing.' >&2
            exit 1
          fi
          verify_dir=$(mktemp -d)
          cd "$verify_dir"
          npm init -y
          npm install --ignore-scripts "@orlo/agent-sdk@$RELEASE_VERSION"
          node -e "const sdk=require('@orlo/agent-sdk'); if(typeof sdk.OrloAgentClient!=='function'||typeof sdk.createGenericRuntimeAdapter!=='function') throw new Error('Missing public SDK exports');"
          npx --no-install orlo-agent-check --help
          npx --no-install orlo-skills --help
  release-artifacts:
    needs: publish
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build and inspect public release archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir artifacts
          npm pack "@orlo/agent-sdk@$RELEASE_VERSION" --pack-destination artifacts
          python -m pip install 'build==1.3.0' 'langchain-core==1.6.10' 'langgraph==1.2.15'
          python -m build --sdist --outdir artifacts packages/python
          python -m pip install artifacts/orlo_langgraph-*.tar.gz
          python -B -m unittest discover -s packages/python/tests -v
          python -m orlo_langgraph.check --help
          node -e "const fs=require('node:fs'),crypto=require('node:crypto'); const rows=fs.readdirSync('artifacts').sort().map(name=>crypto.createHash('sha256').update(fs.readFileSync('artifacts/'+name)).digest('hex')+'  '+name);fs.writeFileSync('artifacts/SHA256SUMS',rows.join('\n')+'\n');"
      - name: Attest release archives and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/*
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" artifacts/* --target "$GITHUB_SHA" --title "Agent SDK $RELEASE_VERSION" --notes-file RELEASE-NOTES.md
